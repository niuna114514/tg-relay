name: 功能建议
description: 想要一个现在没有的能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ 动手写代码之前先开 Issue —— 下面几类需求很可能被否掉，先说清楚能省你时间：

        - **多账号 / 账号池**：要重做配额与限流模型，约 1~2 天；群数 ≤ 10 时单账号够用
        - **去转发头（看起来像原创）**：要改成下载重传，耗带宽、特殊消息会失真，
          而且更容易被判成垃圾
        - **提频**：反垃圾看的是"同一个群反复出现同样的内容"，
          `tgrelay/risk.py` 能算给你看现在的配置风险有多大
        - **托管成多租户服务**：架构不支持（单进程单 session）

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: |
        先说问题，不要说方案。比如"我有 20 个群，一个号发不过来"比
        "请加账号池"有用得多 —— 也许有更省事的解法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 如果有想法就写；没有也行，写"不知道"就好。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过去的
      description: 现在是用脚本、手动、还是干脆忍受？
    validations:
      required: false
