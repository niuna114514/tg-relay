name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 确认依赖锁文件与 requirements.txt 一致
        # 锁文件是给生产部署用的，这里只做一次存在性检查，失败不阻断
        run: |
          test -f requirements.lock.txt && echo "锁文件存在" || echo "没有锁文件"

      - name: 跑测试
        # 所有测试都不依赖网络（用 tests/helpers.py 里的假客户端），
        # 所以这里不需要任何凭据，也不该需要
        run: python -m pytest -q

      - name: 检查源码都带 AGPL 许可证头
        run: |
          missing=0
          for f in tgrelay/*.py *.py; do
            case "$(basename "$f")" in _*) continue ;; esac
            head -20 "$f" | grep -q "GNU Affero General Public License" || {
              echo "缺许可证头: $f"; missing=1;
            }
          done
          exit $missing

      - name: 检查没有混进凭据
        # 只查常见形状，真正的把关还是在 .gitignore 和人的自觉
        run: |
          set +e
          hits=$(grep -rnE \
            -e '[0-9]{8,12}:[A-Za-z0-9_-]{30,}' \
            -e '(api_hash|API_HASH)[[:space:]]*=[[:space:]]*[0-9a-f]{32}' \
            --include='*.py' --include='*.yaml' --include='*.md' --include='*.example' . \
            | grep -v 'your_\|<你的' || true)
          if [ -n "$hits" ]; then
            echo "疑似凭据："; echo "$hits"; exit 1
          fi
          echo "没有发现疑似凭据"
