# =============================================================
# 协议号 频道 -> 多群 转发配置
#
# 用法：改成本频道/群的实际值。@用户名 或 -100 开头的数字 ID
# 数字 ID 第一次用需要暖场（见 README 的"必须先做一次暖场"）
# =============================================================

# 源：一个或多个频道（多个源会同时监听，共用下面的目标群和配额）
sources:
  - "@your_source_channel"
  # - "@another_source_channel"

# 目标：多个群 / 频道。转发模式会保留「转发自 XXX」的来源标记
targets:
  - id: "@your_group_a"
    label: 群A                 # 日志/面板里显示的名字，方便排查
    # 该群发送间隔（秒，区间内随机）。
    # 目标群开了慢速模式时，这里必须 >= 慢速值，否则每条都撞慢速墙白等。
    # interval: [30, 35]
    # 该群单独的每日额度。0 或不写 = 用全局 rate.daily_cap。
    # 群多的时候建议每群都设，避免"先发满的群把总额度吃光"。
    # daily_limit: 50

  # - id: "@your_group_b"
  #   label: 群B

# 过滤：命中才转发。全部留空 = 不过滤，源里发什么转什么
filters:
  keywords: []          # 命中任一关键词才转发（空列表=不限）
  keyword_mode: any     # any = 命中任一即可 | all = 必须全部命中
  exclude: []           # 命中任一关键词就跳过（优先级最高）
  regex: []             # 正则白名单，命中任一才转发（空=不限）
  min_length: 0         # 纯文本最小长度（带媒体的消息只看文案，不受此限）
  media: []             # 限定类型: photo video document audio voice gif sticker poll
                        # 空列表 = 所有类型都转

# 限速：防风控的核心。第一次用请保持保守值，跑 24 小时没问题再逐步放宽
rate:
  per_target_interval: [3, 6]    # 默认发送间隔：往同一个群发消息之间至少隔多久
  cross_target_delay: [5, 15]    # 同一条消息投给多个群时，群与群之间的间隔
  global_per_minute: 20          # 所有目标合计每分钟上限
  daily_cap: 200                 # 全局每日总闸（跨所有群合计）
                                 #   0 = 不限，完全交给各群的 daily_limit
                                 #   注意：如果各群都设了 daily_limit，这里的值要比"各群之和"大，
                                 #         否则先发满的群会把总闸吃光、后面的群发不出去

# 是否已开通 Premium（也可用 .env 的 TG_PREMIUM，由 --premium 参数覆盖）
# Premium 用户：可转发"禁止转发"保护的频道内容，且配额更高
premium: false

behavior:
  sync_edits: false              # 源消息被编辑时，同步编辑已转发的消息
  sync_deletes: false            # 源消息被删除时，同步删除已转发的消息

  # 首次运行务必保持 false：否则启动时会尝试把源频道的历史消息全部补发过去，
  # 目标群会被历史内容刷屏，日额度也会一下被吃光。
  catch_up_on_start: false
  catch_up_limit: 10             # 单次补漏的最大条数

  album_window: 0.6              # 相册聚合窗口（秒），网络慢可以调到 1.0
  queue_size: 200                # 每个目标的待发队列长度（满则丢弃最旧的）
  drop_on_queue_full: true       # true = 丢弃最旧的保新的；false = 拒绝新任务
  forward_as_album: true         # 相册按整组转发（保持图集形态，且只算 1 条配额）

storage:
  db_path: data/relay.db
  log_path: data/relay.log

# =============================================================
# 定时重发：把源里固定的几条消息，循环重发到目标群
#
# 与上面的实时转发相互独立，可以同时开，也可以只开一个（--repost-only）
#   * 实时转发：源发新消息就跟着转，每条只转一次
#   * 定时重发：固定素材按周期反复发，用于把某条内容长期摆在群里
#
# ⚠️ 两个"间隔"别搞混：
#     targets[].interval  = 往同一个群发消息之间至少隔多久
#     repost.interval     = 重发循环多久跑一轮（一轮要把所有素材各发一遍）
#   所以轮次间隔最好 > 素材数 × 群发送间隔，否则会一轮接一轮不停发。
# =============================================================
repost:
  enabled: false

  # 素材范围（含两端）。"6-10" 表示第 6 条到第 10 条
  ranges: []
  # 额外补几条离散的（与 ranges 合并、自动去重）
  ids: []

  # 每轮之间的间隔（秒）。必须 ≥ 31：目标群慢速 30s 时低于它会每条都撞墙
  interval: 300

  # 重发单独的每日额度，不挤占上面 rate.daily_cap（两本账分开记）
  daily_limit: 200

  # 只发给这些目标（填 id 或 label）；留空 = 所有 targets
  targets: []

  # true = 每轮随机顺序（看起来更自然）；false = 固定顺序轮转
  shuffle: false

  # loop = 常驻循环；once = 只跑一轮就退出
  run_mode: loop
